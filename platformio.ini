[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
build_src_filter = +<esp_cam.cpp> -<esp_c3.cpp>
monitor_speed = 115200
upload_speed = 921600
; --- Memória -------------------------------------------------
; Módulo N16R8 (16MB flash + 8MB PSRAM octal) -> qio_opi  (mais comum)
; Módulo N8R2  (8MB flash + 2MB PSRAM quad)   -> troque para qio_qspi
; e use board_upload.flash_size = 8MB / default_8MB.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
build_flags =
    -DBOARD_HAS_PSRAM                  ; habilita PSRAM no Arduino core
    -DCONFIG_SPIRAM_USE_CAPS_ALLOC=1   ; aloca heap de PSRAM via caps
    -DCONFIG_OV3660_SUPPORT=1          ; garante driver OV3660 (já é default no core)
    ; -DARDUINO_USB_CDC_ON_BOOT=1        ; Serial via USB nativo (remova se usar UART0)
    -DCORE_DEBUG_LEVEL=0               ; sem logs = menos overhead
    -O2                                ; otimização de velocidade
    ; -mfix-esp32-psram-cache-issue        ; Pode remover esta linha (é exclusiva do ESP32 original, não do S3)

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_src_filter = +<esp_c3.cpp> -<esp_cam.cpp>
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bogde/HX711@^0.7.5
    links2004/WebSockets @ ^2.4.1